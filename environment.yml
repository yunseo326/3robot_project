name: 3robot
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - ffmpeg
  - pip
  - pip:
      - absl-py==2.5.0
      - aiofiles==25.1.0
      - asttokens==3.0.2
      - blinker==1.9.0
      # brax: STAGE 0 측정/STAGE 1 구버전 MJX 파이프라인(envs/biped_rl.py,
      # scripts/train_stage1.py, colab_launch_stage0.py)에서만 씀 — 지금 로컬에서
      # 도는 STAGE 1/2(train_stage1_local.py, train_stage2_local.py, SB3 기반)는
      # 안 씀. brax/flax/mujoco-mjx/orbax-checkpoint/jaxopt/optax/playground가
      # 서로 얽혀있고 orbax-checkpoint가 Windows 긴 경로 제한(260자)에 걸려
      # 설치가 막힘 — 관리자 권한으로 LongPathsEnabled 켠 뒤 이 7개를 별도로
      # 설치할 것. 그 전까진 주석 처리.
